[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-maker"
version = "0.1.3"
requires-python = ">=3.11"
dependencies = [
  "typer[all]>=0.12",
  "rich>=13",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "structlog>=24",
  "lancedb>=0.10",
  "langchain-text-splitters>=0.2",
  "pypdf[crypto]>=4",
  "python-docx>=1",
  "ebooklib>=0.18",
  "beautifulsoup4>=4.12",
  "sentence-transformers>=3.3",
  "tomli-w>=1.0",
  "PySide6>=6.7",
  "darkdetect>=0.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "respx>=0.21",
  "mypy>=1.10",
  "ruff>=0.4",
  "import-linter>=2",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "pytest-qt>=4",
]

[project.scripts]
rag = "rag_maker.adapters.driving.cli.main:app"
rag-gui = "rag_maker.adapters.driving.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_maker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: testes unitários puros (sem I/O)",
  "integration: testes com I/O real ou mocks de serviços externos",
  "e2e: testes de ponta a ponta via subprocess",
]

[tool.coverage.run]
source = ["src/rag_maker"]
omit = ["src/rag_maker/adapters/driving/gui/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
