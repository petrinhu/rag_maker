name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-22.04
    steps:
      - name: Show runner env
        run: |
          echo "uname: $(uname -a)"
          echo "user: $(whoami)"
          echo "pwd: $(pwd)"
          which git python3 curl || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt system deps + uv
        run: |
          apt-get update -qq
          apt-get install -y -qq \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            libegl1 libgl1 libfontconfig1 libdbus-1-3
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync env
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --extra dev

      - name: Ruff check
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run ruff check src/ tests/

      - name: Ruff format check
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run ruff format --check src/ tests/

      - name: Mypy strict
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run mypy src/

      - name: Import linter
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run lint-imports

      - name: Bandit
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run bandit -r src/ -c bandit.yaml --severity-level medium

      - name: Unit tests + coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run pytest -m unit -q --cov=src/rag_maker --cov-fail-under=70

      - name: Build wheel + sdist
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv build
          ls -lh dist/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: ignore

  release:
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-22.04
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv + jq
        run: |
          apt-get update -qq && apt-get install -y -qq jq
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv build

      - name: Create Codeberg release + upload artifacts
        env:
          TOKEN: ${{ secrets.CLAUDIO_RAG }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          API="https://codeberg.org/api/v1/repos/$REPO"
          REL=$(curl -sf -X POST -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            "$API/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"draft\":false,\"prerelease\":false}" || true)
          REL_ID=$(echo "$REL" | jq -r '.id // empty')
          if [ -z "$REL_ID" ]; then
            REL_ID=$(curl -sf -H "Authorization: token $TOKEN" "$API/releases/tags/$TAG" | jq -r '.id')
          fi
          for f in dist/rag_maker-*.whl dist/rag_maker-*.tar.gz; do
            curl -sf -X POST -H "Authorization: token $TOKEN" \
              -F "attachment=@$f" \
              "$API/releases/$REL_ID/assets?name=$(basename $f)"
          done
