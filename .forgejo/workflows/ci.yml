name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: docker
    container:
      image: code.forgejo.org/oci/node:20-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python + uv
        run: |
          apt-get update -qq
          apt-get install -y -qq python3.11 python3.11-venv python3-pip curl
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync env
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Mypy strict
        run: uv run mypy src/

      - name: Import linter
        run: uv run lint-imports

      - name: Bandit
        run: uv run bandit -r src/ -c bandit.yaml

      - name: Unit tests + coverage
        run: uv run pytest -m unit -q --cov=src/rag_maker --cov-fail-under=70

  build:
    runs-on: docker
    container:
      image: code.forgejo.org/oci/node:20-bookworm
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python + uv
        run: |
          apt-get update -qq
          apt-get install -y -qq python3.11 python3.11-venv python3-pip curl
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build wheel + sdist
        run: |
          uv build
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  release:
    runs-on: docker
    container:
      image: code.forgejo.org/oci/node:20-bookworm
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python + uv + jq
        run: |
          apt-get update -qq
          apt-get install -y -qq python3.11 python3.11-venv python3-pip curl jq
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        run: uv build

      - name: Create Codeberg release + upload artifacts
        env:
          TOKEN: ${{ secrets.CLAUDIO_RAG }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          API="https://codeberg.org/api/v1/repos/$REPO"
          REL=$(curl -sf -X POST -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            "$API/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"draft\":false,\"prerelease\":false}" || true)
          REL_ID=$(echo "$REL" | jq -r '.id // empty')
          if [ -z "$REL_ID" ]; then
            REL_ID=$(curl -sf -H "Authorization: token $TOKEN" "$API/releases/tags/$TAG" | jq -r '.id')
          fi
          for f in dist/rag_maker-*.whl dist/rag_maker-*.tar.gz; do
            curl -sf -X POST -H "Authorization: token $TOKEN" \
              -F "attachment=@$f" \
              "$API/releases/$REL_ID/assets?name=$(basename $f)"
          done
