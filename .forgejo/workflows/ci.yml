name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-22.04
    steps:
      - name: Show runner env
        run: |
          echo "uname: $(uname -a)"
          echo "user: $(whoami)"
          echo "pwd: $(pwd)"
          which git python3 curl || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt system deps + uv
        run: |
          apt-get update -qq
          apt-get install -y -qq \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            libegl1 libgl1 libfontconfig1 libdbus-1-3
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync env
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --extra dev

      - name: Ruff check
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run ruff check src/ tests/

      - name: Ruff format check
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run ruff format --check src/ tests/

      - name: Mypy strict
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run mypy src/

      - name: Import linter
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run lint-imports

      - name: Bandit
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run bandit -r src/ -c bandit.yaml --severity-level medium

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run pytest -m unit -q --no-cov

      - name: Build wheel + sdist
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv build
          ls -lh dist/

  release:
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-22.04
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv + jq
        run: |
          apt-get update -qq && apt-get install -y -qq jq
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv build

      - name: Create Codeberg release + upload artifacts
        env:
          TOKEN: ${{ secrets.CLAUDIO_RAG }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          API="https://codeberg.org/api/v1/repos/$REPO"

          # Sanity: token presente?
          if [ -z "${TOKEN:-}" ]; then
            echo "FATAL: secret CLAUDIO_RAG vazio. Configure em Codeberg > Settings > Actions > Secrets."
            exit 1
          fi
          echo "Token length: ${#TOKEN}"

          # Tentar criar release. Captura body + status.
          echo "POST $API/releases"
          REL_BODY=$(mktemp); REL_CODE=$(curl -s -o "$REL_BODY" -w "%{http_code}" -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            "$API/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"draft\":false,\"prerelease\":false}")
          echo "POST status: $REL_CODE"
          cat "$REL_BODY"; echo

          if [ "$REL_CODE" = "201" ]; then
            REL_ID=$(jq -r '.id' < "$REL_BODY")
          else
            # Pode ja existir, buscar pelo tag.
            echo "GET $API/releases/tags/$TAG"
            GET_BODY=$(mktemp); GET_CODE=$(curl -s -o "$GET_BODY" -w "%{http_code}" \
              -H "Authorization: token $TOKEN" "$API/releases/tags/$TAG")
            echo "GET status: $GET_CODE"
            cat "$GET_BODY"; echo
            if [ "$GET_CODE" != "200" ]; then
              echo "FATAL: nao consegui criar nem encontrar release."
              exit 1
            fi
            REL_ID=$(jq -r '.id' < "$GET_BODY")
          fi
          echo "Release ID: $REL_ID"

          # Lista assets ja anexados para idempotencia.
          EXISTING=$(curl -s -H "Authorization: token $TOKEN" \
            "$API/releases/$REL_ID/assets" | jq -r '.[].name' 2>/dev/null || echo "")
          echo "Assets ja anexados: $EXISTING"

          for f in dist/rag_maker-*.whl dist/rag_maker-*.tar.gz; do
            BN=$(basename "$f")
            if echo "$EXISTING" | grep -qx "$BN"; then
              echo "Skip $BN (ja anexado)"
              continue
            fi
            echo "Upload $f"
            ASSET_CODE=$(curl -s -o /tmp/asset_resp -w "%{http_code}" -X POST \
              -H "Authorization: token $TOKEN" \
              -F "attachment=@$f" \
              "$API/releases/$REL_ID/assets?name=$BN")
            echo "Asset $f status: $ASSET_CODE"
            cat /tmp/asset_resp; echo
            # 201 created, 409 conflito ja-existe (idempotente)
            case "$ASSET_CODE" in
              201|409) : ;;
              *) echo "FATAL upload"; exit 1 ;;
            esac
          done
          echo "Release $TAG publicada com sucesso."
