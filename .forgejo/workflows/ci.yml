name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-22.04
    steps:
      - name: Show runner env
        run: |
          echo "uname: $(uname -a)"
          echo "user: $(whoami)"
          echo "pwd: $(pwd)"
          which git python3 curl || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt system deps + uv
        run: |
          apt-get update -qq
          apt-get install -y -qq \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            libegl1 libgl1 libfontconfig1 libdbus-1-3
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync env
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --extra dev

      - name: pip-audit (SCA — dependências vulneráveis)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Gate SCA real (AUD-CIDOCS-1 / AUD-SEC-1, CONTRACT.md A06 + §11.2).
          # Falha em QUALQUER CVE não explicitamente listado abaixo.
          # `--skip-editable` só exclui o próprio pacote local (rag-maker),
          # que não existe no PyPI — não afeta a auditoria de deps de terceiros.
          #
          # Cada --ignore-vuln é exceção DATADA e RASTREADA, nunca "porque sim".
          # Ao corrigir a dependência (bump de versão), REMOVA a linha
          # correspondente NO MESMO commit do bump. Esta lista deve encolher,
          # nunca crescer sem um novo comentário datado + justificativa.
          #
          # Snapshot de origem: 2026-07-11, `uv run pip-audit --skip-editable`
          # (auditoria AUDIT_FIND.md) -> 27 vulnerabilidades conhecidas em
          # 11 pacotes, nenhuma com severidade CRITICAL nas fontes consultadas
          # (OSV/PyPI advisory sem CVSS "CRITICAL" nesses IDs específicos).
          #
          # cryptography      46.0.7  GHSA-537c-gmf6-5ccf  fix>=48.0.1  -- OpenSSL vendorizado vulnerável. SEM item TODO.md dedicado — abrir antes do próximo review de segurança.
          # idna              3.11    PYSEC-2026-215       fix>=3.15    -- SEM item TODO.md dedicado.
          # langchain-core    1.3.0   CVE-2026-44843       fix>=1.3.3   -- SEM item TODO.md dedicado.
          # langsmith         0.7.32  CVE-2026-45134       fix>=0.8.0   -- SEM item TODO.md dedicado.
          # langsmith         0.7.32  GHSA-f4xh-w4cj-qxq8  fix>=0.8.18  -- SEM item TODO.md dedicado.
          # msgpack           1.1.2   GHSA-6v7p-g79w-8964  fix>=1.2.1   -- SEM item TODO.md dedicado.
          # pip               26.0.1  PYSEC-2026-196       fix>=26.1.2  -- toolchain do runner (não shippa no wheel). SEM item TODO.md dedicado.
          # pip               26.0.1  CVE-2026-3219        fix>=26.1    -- idem.
          # pip               26.0.1  CVE-2026-6357        fix>=26.1    -- idem.
          # pydantic-settings 2.13.1  GHSA-4xgf-cpjx-pc3j  fix>=2.14.2  -- SEM item TODO.md dedicado.
          # pypdf             6.10.2  CVE-2026-48156       fix>=6.12.0  -- rastreado em TODO.md F12.23 (AUD-SEC-2).
          # pypdf             6.10.2  CVE-2026-48155       fix>=6.12.0  -- TODO.md F12.23.
          # pypdf             6.10.2  CVE-2026-48735       fix>=6.12.1  -- TODO.md F12.23.
          # pypdf             6.10.2  CVE-2026-49461       fix>=6.12.2  -- TODO.md F12.23.
          # pypdf             6.10.2  CVE-2026-49460       fix>=6.12.2  -- TODO.md F12.23.
          # pypdf             6.10.2  CVE-2026-54531       fix>=6.13.0  -- TODO.md F12.23.
          # pypdf             6.10.2  CVE-2026-54530       fix>=6.13.0  -- TODO.md F12.23.
          # pypdf             6.10.2  GHSA-jm82-fx9c-mx94  fix>=6.13.3  -- TODO.md F12.23.
          # pypdf             6.10.2  CVE-2026-54651       fix>=6.13.1  -- TODO.md F12.23.
          # soupsieve         2.8.3   CVE-2026-49477       fix>=2.8.4   -- SEM item TODO.md dedicado.
          # soupsieve         2.8.3   CVE-2026-49476       fix>=2.8.4   -- SEM item TODO.md dedicado.
          # torch             2.11.0  CVE-2025-3000        sem fix publicado -- SEM item TODO.md dedicado; sem fix_version, reavaliar a cada execução (não expira sozinho).
          # urllib3           2.6.3   PYSEC-2026-142       fix>=2.7.0   -- SEM item TODO.md dedicado.
          # urllib3           2.6.3   PYSEC-2026-141       fix>=2.7.0   -- SEM item TODO.md dedicado.
          uv run pip-audit --skip-editable \
            --ignore-vuln GHSA-537c-gmf6-5ccf \
            --ignore-vuln PYSEC-2026-215 \
            --ignore-vuln CVE-2026-44843 \
            --ignore-vuln CVE-2026-45134 \
            --ignore-vuln GHSA-f4xh-w4cj-qxq8 \
            --ignore-vuln GHSA-6v7p-g79w-8964 \
            --ignore-vuln PYSEC-2026-196 \
            --ignore-vuln CVE-2026-3219 \
            --ignore-vuln CVE-2026-6357 \
            --ignore-vuln GHSA-4xgf-cpjx-pc3j \
            --ignore-vuln CVE-2026-48156 \
            --ignore-vuln CVE-2026-48155 \
            --ignore-vuln CVE-2026-48735 \
            --ignore-vuln CVE-2026-49461 \
            --ignore-vuln CVE-2026-49460 \
            --ignore-vuln CVE-2026-54531 \
            --ignore-vuln CVE-2026-54530 \
            --ignore-vuln GHSA-jm82-fx9c-mx94 \
            --ignore-vuln CVE-2026-54651 \
            --ignore-vuln CVE-2026-49477 \
            --ignore-vuln CVE-2026-49476 \
            --ignore-vuln CVE-2025-3000 \
            --ignore-vuln PYSEC-2026-142 \
            --ignore-vuln PYSEC-2026-141

      - name: Ruff check
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run ruff check src/ tests/

      - name: Ruff format check
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run ruff format --check src/ tests/

      - name: Mypy strict
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run mypy src/

      - name: Import linter
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run lint-imports

      - name: Bandit
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # Sem --severity-level: qualquer Low NOVO (sem # nosec BXXX pontual e
          # justificado) quebra o gate (F12.17 / AUD-SEC-3). Achados Low reais
          # existentes têm # nosec BXXX -- justificativa inline no código.
          uv run bandit -r src/ -c bandit.yaml

      - name: Unit + integration tests (coverage gate)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # integration/ usa fakes e respx (mock de HTTP) — roda 100% headless,
          # sem precisar de Ollama nem GPU. Os 4 testes de
          # TestCrossEncoderReranker que exigem o modelo real
          # (BAAI/bge-reranker-v2-m3) têm skipif condicionado à presença do
          # cache HuggingFace (~500MB) — neste runner o cache não existe, logo
          # são pulados automaticamente (não travam nem falham o CI).
          # Gate de cobertura (fail_under=70) vem de pyproject.toml
          # [tool.coverage.report] e é aplicado só sobre unit+integration —
          # e2e roda via subprocess isolado e não é instrumentável aqui.
          uv run pytest -m "unit or integration" -q \
            --cov=src/rag_maker --cov-report=term-missing --cov-fail-under=70

      - name: E2E tests (CLI via subprocess)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          # test_cli.py invoca `python -m rag_maker...cli.main` via subprocess.
          # Não exige Ollama real rodando: a checagem de status usa probe()
          # com timeout de 2s e degrada graciosamente quando o daemon não
          # responde. Por isso roda em todo push/PR, não só em release.
          # --no-cov: subprocess não é instrumentado pelo coverage do
          # processo pai; medir aqui só poluiria/zeraria o dado da etapa
          # anterior sem agregar sinal real.
          uv run pytest -m e2e -q --no-cov

      - name: Build wheel + sdist
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv build
          ls -lh dist/

  release:
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-22.04
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv + jq
        run: |
          apt-get update -qq && apt-get install -y -qq jq
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv build

      - name: Create Codeberg release + upload artifacts
        env:
          TOKEN: ${{ secrets.CLAUDIO_RAG }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          API="https://codeberg.org/api/v1/repos/$REPO"

          # Sanity: token presente?
          if [ -z "${TOKEN:-}" ]; then
            echo "FATAL: secret CLAUDIO_RAG vazio. Configure em Codeberg > Settings > Actions > Secrets."
            exit 1
          fi
          echo "Token length: ${#TOKEN}"

          # Tentar criar release. Captura body + status.
          echo "POST $API/releases"
          REL_BODY=$(mktemp); REL_CODE=$(curl -s -o "$REL_BODY" -w "%{http_code}" -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            "$API/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"draft\":false,\"prerelease\":false}")
          echo "POST status: $REL_CODE"
          cat "$REL_BODY"; echo

          if [ "$REL_CODE" = "201" ]; then
            REL_ID=$(jq -r '.id' < "$REL_BODY")
          else
            # Pode ja existir, buscar pelo tag.
            echo "GET $API/releases/tags/$TAG"
            GET_BODY=$(mktemp); GET_CODE=$(curl -s -o "$GET_BODY" -w "%{http_code}" \
              -H "Authorization: token $TOKEN" "$API/releases/tags/$TAG")
            echo "GET status: $GET_CODE"
            cat "$GET_BODY"; echo
            if [ "$GET_CODE" != "200" ]; then
              echo "FATAL: nao consegui criar nem encontrar release."
              exit 1
            fi
            REL_ID=$(jq -r '.id' < "$GET_BODY")
          fi
          echo "Release ID: $REL_ID"

          # Lista assets ja anexados para idempotencia.
          EXISTING=$(curl -s -H "Authorization: token $TOKEN" \
            "$API/releases/$REL_ID/assets" | jq -r '.[].name' 2>/dev/null || echo "")
          echo "Assets ja anexados: $EXISTING"

          for f in dist/rag_maker-*.whl dist/rag_maker-*.tar.gz; do
            BN=$(basename "$f")
            if echo "$EXISTING" | grep -qx "$BN"; then
              echo "Skip $BN (ja anexado)"
              continue
            fi
            echo "Upload $f"
            ASSET_CODE=$(curl -s -o /tmp/asset_resp -w "%{http_code}" -X POST \
              -H "Authorization: token $TOKEN" \
              -F "attachment=@$f" \
              "$API/releases/$REL_ID/assets?name=$BN")
            echo "Asset $f status: $ASSET_CODE"
            cat /tmp/asset_resp; echo
            # 201 created, 409 conflito ja-existe (idempotente)
            case "$ASSET_CODE" in
              201|409) : ;;
              *) echo "FATAL upload"; exit 1 ;;
            esac
          done
          echo "Release $TAG publicada com sucesso."
