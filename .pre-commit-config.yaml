repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        args: [--strict, --ignore-missing-imports]
        additional_dependencies:
          - pydantic-settings>=2.2
          - types-beautifulsoup4
          - types-Pillow

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        # Sem -ll: qualquer Low NOVO sem # nosec BXXX pontual quebra o hook
        # (F12.17 / AUD-SEC-3).
        args: [-r, src/, -c, bandit.yaml]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # F12.27 / AUD-SEC-4: secret scan local, modo protect (staged) — só
      # olha o que está prestes a ser commitado, roda rápido no dia-a-dia.
      # A varredura de história completa acontece no CI (ci.yml).
      - id: gitleaks

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter
        entry: lint-imports
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-unit
        name: pytest (unit)
        entry: pytest tests/unit -x -q --tb=short
        language: system
        pass_filenames: false
        always_run: true
